# 案件リポジトリの .github/workflows/deploy.yml にそのまま置く。
# 実体は BROMOdesign/xserver-wp-deploy 側にあるので、キットの修正は
# タグを追うだけで反映される。
name: Deploy to production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（転送せず差分だけ表示する）'
        type: boolean
        default: false

jobs:
  deploy:
    uses: BROMOdesign/xserver-wp-deploy/.github/workflows/deploy.yml@v1
    with:
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
